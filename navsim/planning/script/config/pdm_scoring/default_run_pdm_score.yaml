# Modified for the ReCogDrive visual backbone ablation release.
hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common 
  job:
    chdir: False

cache_path: ${oc.env:NAVSIM_EXP_ROOT}/pixel_cache
use_cache_without_dataset: false # load the training samples from the cache. scene-filter will be ignored
force_cache_computation: true

defaults:
  - default_common
  - default_evaluation
  - default_scoring_parameters
  - agent: recogdrive_agent
  - _self_
  - override train_test_split: navtrain

metric_cache_path: ${oc.env:NAVSIM_EXP_ROOT}/metric_cache # path to metric cache

# Feature saving configuration
save_features: false  # Enable to save intermediate features during evaluation
feature_save_path: ${oc.env:NAVSIM_EXP_ROOT}/features  # Base path for saving features

# Prediction saving configuration
save_predictions: false  # Enable to save model output predictions during evaluation
predictions_save_path: ${oc.env:NAVSIM_EXP_ROOT}/predictions  # Base path for saving predictions

best_of_n: 1
